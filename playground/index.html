<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@ui9000/widgets — Playground</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f9fafb;
        color: #111827;
      }
      header {
        padding: 1.5rem 2rem;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
      }
      header h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
      header p { margin: 0; color: #6b7280; }
      main { padding: 2rem; max-width: 1100px; margin: 0 auto; }
      .controls {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1.5rem;
        align-items: end;
      }
      label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: #6b7280; }
      select, button {
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background: #fff;
        font-size: 0.875rem;
      }
      button { cursor: pointer; background: #2563eb; color: #fff; border-color: #2563eb; }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .panel {
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 1rem;
      }
      .panel h2 { margin: 0 0 0.75rem; font-size: 1rem; }
      .chart-host {
        height: 320px;
        border: 1px dashed #e5e7eb;
        border-radius: 4px;
      }
      code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 4px; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>@ui9000/widgets</h1>
      <p>D3 chat charts — LineChart + Lollipop + StepLineChart + Barchart (Visx removed)</p>
    </header>
    <main>
      <div class="controls">
        <label>
          Theme
          <select id="mode-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label>
          Scale
          <select id="scale-select">
            <option value="compact">Compact</option>
            <option value="default" selected>Default</option>
            <option value="comfortable">Comfortable</option>
          </select>
        </label>
        <label>
          Step overlay
          <select id="graf-type-select">
            <option value="none" selected>None</option>
            <option value="curve">KS plot (curve)</option>
            <option value="line">ROC (line)</option>
          </select>
        </label>
        <label>
          Bar layout
          <select id="bar-layout-select">
            <option value="single" selected>Single series</option>
            <option value="grouped">Grouped</option>
            <option value="stacked">Stacked</option>
            <option value="cumulative">Single + cumulative</option>
          </select>
        </label>
        <label>
          Lollipop / bar orientation
          <select id="orientation-select">
            <option value="vertical" selected>Vertical</option>
            <option value="horizontal">Horizontal</option>
          </select>
        </label>
        <button id="reload-btn" type="button">Reload</button>
      </div>
      <div class="grid" id="widget-context">
        <div class="panel">
          <h2>Line chart</h2>
          <div class="chart-host" id="line-host"></div>
        </div>
        <div class="panel">
          <h2>Lollipop</h2>
          <div class="chart-host" id="lollipop-host"></div>
        </div>
        <div class="panel">
          <h2>Step line chart</h2>
          <div class="chart-host" id="step-line-host"></div>
        </div>
        <div class="panel">
          <h2>Bar chart</h2>
          <div class="chart-host" id="bar-host"></div>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
