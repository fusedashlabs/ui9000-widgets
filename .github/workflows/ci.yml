name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  widgets:
    runs-on: ubuntu-latest
    env:
      FUSELAB_TOKEN: ${{ secrets.FUSELAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: corepack prepare yarn@4.5.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      # Fork PRs receive no secrets. Hardened mode then refreshes the lockfile
      # against GitHub Packages with no token. The design-system package is
      # already in the cache restored above, so install from that cache.
      - name: Install
        run: |
          if [ -z "${FUSELAB_TOKEN}" ]; then
            echo "Fork pull request: no registry token. Installing from the restored Yarn cache."
            export YARN_ENABLE_HARDENED_MODE=0
            export YARN_ENABLE_OFFLINE_MODE=1
          fi
          yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn license-check
      - run: node scripts/no-raw-rows.mjs

  playground:
    runs-on: ubuntu-latest
    env:
      FUSELAB_TOKEN: ${{ secrets.FUSELAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: corepack prepare yarn@4.5.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - name: Install
        run: |
          if [ -z "${FUSELAB_TOKEN}" ]; then
            echo "Fork pull request: no registry token. Installing from the restored Yarn cache."
            export YARN_ENABLE_HARDENED_MODE=0
            export YARN_ENABLE_OFFLINE_MODE=1
          fi
          yarn install --immutable
      - run: yarn build
      - run: yarn build:playground

  storybook:
    runs-on: ubuntu-latest
    env:
      FUSELAB_TOKEN: ${{ secrets.FUSELAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: corepack enable
      - run: corepack prepare yarn@4.5.0 --activate
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
      - name: Install
        run: |
          if [ -z "${FUSELAB_TOKEN}" ]; then
            echo "Fork pull request: no registry token. Installing from the restored Yarn cache."
            export YARN_ENABLE_HARDENED_MODE=0
            export YARN_ENABLE_OFFLINE_MODE=1
          fi
          yarn install --immutable
      - name: Build Storybook
        env:
          STORYBOOK_BASE: /storybook/
        run: yarn build-storybook
      - run: test -f storybook-static/index.html
